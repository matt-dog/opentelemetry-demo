# Astronomy Shop (opentelemetry-demo chart 0.42.1) on a local cluster, sending to
# the DDOT Collector that the opentelemetry-examples kube-stack installer runs
# (OTel Operator + kube-stack, ddot flow). See README.md.

# The kube-stack DDOT daemon collector replaces the demo's bundled Collector.
opentelemetry-collector:
  enabled: false

default:
  envOverrides:
    # Every service, and frontend-proxy's /otlp-http route for browser spans,
    # sends OTLP to $(OTEL_COLLECTOR_NAME):4317/4318.
    - name: OTEL_COLLECTOR_NAME
      value: opentelemetry-kube-stack-daemon-collector.opentelemetry-operator-system.svc.cluster.local

# Logs go to Datadog through the DDOT Collector; nothing feeds OpenSearch.
opensearch:
  enabled: false

components:
  load-generator:
    envOverrides:
      # The chart points the load generator at :4318 (OTLP/HTTP), but its
      # locustfile exports over gRPC, so its user_* parent spans never arrive and
      # each user flow shows in Jaeger as several root spans.
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4317
    # The image's locustfile with shopping prompts for the agent on Claude
    # (load-generator/locustfile.py; up.sh makes the ConfigMap from it).
    mountedConfigMaps:
      - name: locustfile
        existingConfigMap: load-generator-locustfile
        mountPath: /usr/src/app/locustfile.py
        subPath: locustfile.py
  frontend-proxy:
    # The image's Envoy template plus a Lua filter that adds the Datadog RUM
    # Browser SDK to the shop's and the chatbot's pages
    # (frontend-proxy/envoy.tmpl.yaml; up.sh makes the ConfigMap and the
    # rum-config secret, the RUM application from dd-apply.py).
    mountedConfigMaps:
      - name: envoy-template
        existingConfigMap: frontend-proxy-envoy
        mountPath: /home/envoy/envoy.tmpl.yaml
        subPath: envoy.tmpl.yaml
    envOverrides:
      - name: DD_RUM_APPLICATION_ID
        valueFrom:
          secretKeyRef: {name: rum-config, key: DD_RUM_APPLICATION_ID}
      - name: DD_RUM_CLIENT_TOKEN
        valueFrom:
          secretKeyRef: {name: rum-config, key: DD_RUM_CLIENT_TOKEN}
      - name: DD_RUM_ENV
        valueFrom:
          secretKeyRef: {name: rum-config, key: DD_RUM_ENV}
      - name: DD_RUM_SITE
        valueFrom:
          secretKeyRef: {name: rum-config, key: DD_RUM_SITE}
  agent:
    # The shop's AI agent on a real Claude model instead of its recorded
    # responses, so Agent Observability shows real tokens and cost. llm.py is
    # replaced with the same ChatLLM class on LangChain's Anthropic client
    # (provider "anthropic"); the aiSlowResponse flag still applies. The image
    # lacks langchain-anthropic, so it is installed at start (1.7.2 is the
    # newest that fits the image's langchain-core 1.6.3). The key comes from the
    # agent-llm secret that up.sh creates from 1Password.
    command:
      - sh
      - -c
      - pip install -q --no-cache-dir langchain-anthropic==1.7.2 && exec python run.py
    envOverrides:
      - name: LLM_MODEL
        value: claude-haiku-5-5
      - name: USE_VCR
        value: "False"
      - name: ANTHROPIC_API_KEY
        valueFrom:
          secretKeyRef: {name: agent-llm, key: ANTHROPIC_API_KEY}
    mountedConfigMaps:
      - name: claude-llm
        mountPath: /app/src/agents/llm.py
        subPath: llm.py
        data:
          llm.py: |
            # Replaces the demo's llm.py (datadog/local/values-local.yaml).
            import asyncio
            import os
            import time

            from langchain_anthropic import ChatAnthropic
            from src.agents.feature_flags import get_int_feature_flag


            class ChatLLM(ChatAnthropic):
                def __init__(self, **kwargs):
                    kwargs.setdefault("model", os.getenv("LLM_MODEL", "claude-haiku-5-5"))
                    kwargs.setdefault("max_tokens", int(os.getenv("LLM_MAX_TOKENS", "16000")))
                    super().__init__(**kwargs)

                def _generate(self, messages, stop=None, run_manager=None, **kwargs):
                    delay_ms = get_int_feature_flag("aiSlowResponse")
                    if delay_ms:
                        time.sleep(delay_ms / 1000)
                    return super()._generate(messages, stop, run_manager, **kwargs)

                async def _agenerate(self, messages, stop=None, run_manager=None, **kwargs):
                    delay_ms = get_int_feature_flag("aiSlowResponse")
                    if delay_ms:
                        await asyncio.sleep(delay_ms / 1000)
                    return await super()._agenerate(messages, stop, run_manager, **kwargs)
  ad:
    # A CPU limit, so adHighCpu (scenarios.yaml) throttles the whole JVM and
    # GetAds slows; with no limit its load threads take spare cores and requests
    # stay at a few ms. Memory is the chart's default, restated because this
    # block replaces it.
    resources:
      limits:
        cpu: 300m
        memory: 300Mi

# The chart's 600Mi Jaeger holds up to 25,000 traces in memory and gets
# OOM-killed with checkout traces of 100+ spans, losing every stored trace.
jaeger:
  jaeger:
    extraEnv:
      - name: MEMORY_MAX_TRACES
        value: "10000"
      - name: PROMETHEUS_ADDR
        value: prometheus:9090
      - name: OTEL_COLLECTOR_HOST
        value: otel-collector
      - name: OTEL_COLLECTOR_PORT_HTTP
        value: "4318"
      - name: JAEGER_HOST
        value: "0.0.0.0"
      - name: JAEGER_GRPC_PORT
        value: "4317"
    resources:
      limits:
        memory: 1536Mi
