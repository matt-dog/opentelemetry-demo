# Astronomy Shop (opentelemetry-demo chart 0.42.1) on a local cluster, sending to
# the DDOT Collector that the opentelemetry-examples kube-stack installer runs
# (OTel Operator + kube-stack, ddot flow). See README.md.

# The kube-stack DDOT daemon collector replaces the demo's bundled Collector.
opentelemetry-collector:
  enabled: false

default:
  envOverrides:
    # Every service, and frontend-proxy's /otlp-http route for browser spans,
    # sends OTLP to $(OTEL_COLLECTOR_NAME):4317/4318.
    - name: OTEL_COLLECTOR_NAME
      value: opentelemetry-kube-stack-daemon-collector.opentelemetry-operator-system.svc.cluster.local

# Logs go to Datadog through the DDOT Collector; nothing feeds OpenSearch.
opensearch:
  enabled: false

components:
  load-generator:
    envOverrides:
      # The chart points the load generator at :4318 (OTLP/HTTP), but its
      # locustfile exports over gRPC, so its user_* parent spans never arrive and
      # each user flow shows in Jaeger as several root spans.
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4317
    # The image's locustfile with the OTLP and gen_ai span changes
    # (load-generator/locustfile.py; up.sh makes the ConfigMap from it).
    mountedConfigMaps:
      - name: locustfile
        existingConfigMap: load-generator-locustfile
        mountPath: /usr/src/app/locustfile.py
        subPath: locustfile.py
  frontend-proxy:
    # The image's Envoy template plus a Lua filter that adds the Datadog RUM
    # Browser SDK to the shop's and the chatbot's pages
    # (frontend-proxy/envoy.tmpl.yaml; up.sh makes the ConfigMap and the
    # rum-config secret, the RUM application from dd-apply.py).
    mountedConfigMaps:
      - name: envoy-template
        existingConfigMap: frontend-proxy-envoy
        mountPath: /home/envoy/envoy.tmpl.yaml
        subPath: envoy.tmpl.yaml
    envOverrides:
      - name: DD_RUM_APPLICATION_ID
        valueFrom:
          secretKeyRef: {name: rum-config, key: DD_RUM_APPLICATION_ID}
      - name: DD_RUM_CLIENT_TOKEN
        valueFrom:
          secretKeyRef: {name: rum-config, key: DD_RUM_CLIENT_TOKEN}
      - name: DD_RUM_ENV
        valueFrom:
          secretKeyRef: {name: rum-config, key: DD_RUM_ENV}
      - name: DD_RUM_SITE
        valueFrom:
          secretKeyRef: {name: rum-config, key: DD_RUM_SITE}
  agent:
    # The chart's defaults for the model: recorded responses (USE_VCR=True,
    # LLM_MODEL azure/gpt-5.5), so no LLM key. The chart's cassette (its
    # agent-fixtures ConfigMap) has no token usage and no aiRunawayAgent run,
    # so its volume points at ours instead: src/agent's newer azure_gpt-5.5
    # cassette with estimated usage added (agent/add-usage.py; up.sh makes the
    # agent-cassette ConfigMap), so Agent Observability shows tokens and cost.
    # The two lists restate the chart's, which these replace. Only the three
    # prompts in the cassette answer (the chatbot's sample buttons, each a new
    # chat); any other prompt, or a follow-up in the same chat, misses. Claude
    # Haiku 5.5 until 2026-11-12 (CHANGES.md).
    # vcrpy runs the image's clean_response on every entry it loads, and that
    # drops `usage`, so agent/patch_vcr.py (the image's, keeping usage) is
    # mounted over it from the agent-patch-vcr ConfigMap up.sh makes.
    additionalVolumeMounts:
      - name: agent-fixtures
        mountPath: /app/fixtures/vcr_cassettes
      - name: agent-patch-vcr
        mountPath: /app/src/agents/patch_vcr.py
        subPath: patch_vcr.py
    additionalVolumes:
      - name: agent-fixtures
        configMap:
          name: agent-cassette
      - name: agent-patch-vcr
        configMap:
          name: agent-patch-vcr
    envOverrides:
      # A miss is sent on to LLM_BASE_URL. The chart's https://local-llm.com is a
      # real public host (resolved 2026-11-12), so point it at a closed local
      # port: a miss fails at once and nothing leaves the cluster.
      - name: LLM_BASE_URL
        value: http://127.0.0.1:9
      # Agent Observability converts OTel GenAI spans only when a span in the
      # trace carries dd_llmobs_enabled=true (opt-in since 2026-10-07). The
      # chart appends _EXTRA to the service's OTEL_RESOURCE_ATTRIBUTES.
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: dd_llmobs_enabled=true
  ad:
    # A CPU limit, so adHighCpu (scenarios.yaml) throttles the whole JVM and
    # GetAds slows; with no limit its load threads take spare cores and requests
    # stay at a few ms. Memory is the chart's default, restated because this
    # block replaces it.
    resources:
      limits:
        cpu: 300m
        memory: 300Mi
  astronomy-db:
    # productCatalogLockContention (scenarios.yaml) queues every catalog read behind a
    # 30 s table lock, one waiting connection each; at the chart's 100Mi Postgres was
    # OOMKilled about four times an hour (2026-10-27), and with no volume each kill wiped
    # the database. The request stays at the chart's 100Mi.
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 300Mi
  fraud-detection:
    # The DDOT SDK in place of the upstream OpenTelemetry Java agent the image
    # ships, for Act 2 (DEMO-PLAN.md): checkout, on the upstream Go SDK, produces
    # to Kafka and fraud-detection consumes on the DDOT SDK, in one trace. An init
    # container copies the DDOT agent jar from its public image and
    # JAVA_TOOL_OPTIONS points at it (the image's own value names
    # /usr/src/app/opentelemetry-javaagent.jar). Same OTEL_* settings and OTLP
    # endpoint. To swap back, delete this block. ad stays upstream, because the
    # DDOT SDK's logs don't reach Datadog yet (CHANGES.md, 2026-10-18).
    initContainers:
      - name: ddot-sdk
        image: datadog/dd-otel-autoinstrumentation-java:1.67-preview
        command: ["cp", "/javaagent.jar", "/ddot/javaagent.jar"]
        volumeMounts: [{name: ddot-sdk, mountPath: /ddot}]
    mountedEmptyDirs:
      - name: ddot-sdk
        mountPath: /ddot
    envOverrides:
      - name: JAVA_TOOL_OPTIONS
        value: -javaagent:/ddot/javaagent.jar -Xmx180m
      - name: OTEL_TRACES_EXPORTER
        value: otlp
      - name: DD_TRACE_OTEL_ENABLED
        value: "true"
      - name: DD_LOGS_OTEL_ENABLED
        value: "true"
      - name: DD_METRICS_OTEL_ENABLED
        value: "true"

# The chart's 600Mi Jaeger holds up to 25,000 traces in memory and gets
# OOM-killed with checkout traces of 100+ spans, losing every stored trace.
jaeger:
  jaeger:
    extraEnv:
      - name: MEMORY_MAX_TRACES
        value: "10000"
      - name: PROMETHEUS_ADDR
        value: prometheus:9090
      - name: OTEL_COLLECTOR_HOST
        value: otel-collector
      - name: OTEL_COLLECTOR_PORT_HTTP
        value: "4318"
      - name: JAEGER_HOST
        value: "0.0.0.0"
      - name: JAEGER_GRPC_PORT
        value: "4317"
    resources:
      limits:
        memory: 1536Mi
