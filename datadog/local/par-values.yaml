# Overrides for the Private Action Runner chart (datadog/private-action-runner), on
# top of the values its enrollment prints (runner identity: urn and privateKey, which
# never go in git). The runner lets the remediation workflow (Act 3, DEMO-PLAN.md)
# read and patch deployments in this namespace only (a Role, not a ClusterRole), and
# call flagd-ui over HTTP inside the cluster. It connects out to Datadog only.
runner:
  roleType: Role
  kubernetesActions:
    deployments: ["get", "patch"]
  resources:
    limits: {cpu: 250m, memory: 512Mi}
    requests: {cpu: 100m, memory: 256Mi}
