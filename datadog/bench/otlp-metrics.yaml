# Benchmark collector, metrics, OTLP path (ddototlp arm). See BENCHMARK.md.
# Same receiver, processors and batching as metrics.yaml; the exporter is otlp_http
# to Datadog's OTLP intake, zstd level 3.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource/bench:
    attributes:
    - key: deployment.environment.name
      value: ${env:BENCH_ENV}
      action: upsert
  # The Datadog Exporter converts cumulative sums itself; the OTLP path does it here.
  cumulativetodelta: {}
  transform/bench_host:
    error_mode: ignore
    trace_statements: &id001
    - context: resource
      statements:
      - set(resource.attributes["host.name"], Concat([resource.attributes["host.name"], "${env:BENCH_HOST_SUFFIX}"], "")) where resource.attributes["host.name"] != nil
      - set(resource.attributes["datadog.host.name"], resource.attributes["host.name"]) where resource.attributes["host.name"] != nil
    metric_statements: *id001
    log_statements: *id001
  batch:
    send_batch_size: 8192
    send_batch_max_size: 8192
    timeout: 10s
exporters:
  otlp_http/datadog:
    endpoint: https://otlp.${env:DD_SITE}
    headers:
      dd-api-key: ${env:DD_API_KEY}
      dd-otel-metric-config: '{ "resource_attributes_as_tags": true, "instrumentation_scope_metadata_as_tags": true }'
    compression: zstd
    compression_params:
      level: 3
service:
  telemetry:
    metrics:
      level: normal
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
  pipelines:
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/bench
      - transform/bench_host
      - cumulativetodelta
      - batch
      exporters:
      - otlp_http/datadog
