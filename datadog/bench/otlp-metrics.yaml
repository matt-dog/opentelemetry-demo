# Benchmark collector, metrics, OTLP path (contribotlp arm). See BENCHMARK.md.
#
# Datadog's OTLP metrics intake accepts delta only, so cumulativetodelta runs
# here, then deltatorate on the metrics the original demo converted to rates (the Datadog Exporter arms convert internally). Exporter settings are
# copied from my-values-file.yml.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource/bench:
    attributes:
    - key: deployment.environment.name
      value: ${env:BENCH_ENV}
      action: upsert
  cumulativetodelta: {}
  transform/bench_host:
    error_mode: ignore
    trace_statements: &id001
    - context: resource
      statements:
      - set(resource.attributes["host.name"], Concat([resource.attributes["host.name"], "${env:BENCH_HOST_SUFFIX}"], "")) where resource.attributes["host.name"] != nil
      - set(resource.attributes["datadog.host.name"], resource.attributes["host.name"]) where resource.attributes["host.name"] != nil
    metric_statements: *id001
    log_statements: *id001
  deltatorate:
    metrics:
    - k8s.pod.network.io
    - k8s.pod.network.errors
    - postgresql.tup_returned
    - postgresql.tup_fetched
    - postgresql.tup_inserted
    - postgresql.tup_updated
    - postgresql.tup_deleted
    - postgresql.operations
    - postgresql.commits
    - postgresql.rollbacks
    - postgresql.blks_hit
    - postgresql.blks_read
    - postgresql.temp_files
    - postgresql.temp.io
    - postgresql.function.calls
    - postgresql.index.scans
    - postgresql.sequential_scans
    - postgresql.blocks_read
exporters:
  otlp_http/datadog:
    endpoint: https://otlp.${env:DD_SITE}
    headers:
      dd-api-key: ${env:DD_API_KEY}
      dd-otel-metric-config: '{ "resource_attributes_as_tags": true, "instrumentation_scope_metadata_as_tags": true }'
    compression: zstd
    compression_params:
      level: 3
    sending_queue:
      batch:
        sizer: bytes
        min_size: 2097152
        max_size: 4194304
service:
  telemetry:
    metrics:
      level: normal
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
  pipelines:
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/bench
      - transform/bench_host
      - cumulativetodelta
      - deltatorate
      exporters:
      - otlp_http/datadog
