# Benchmark collector, metrics. The same file runs in every arm (DDOT and contrib);
# only the image and BENCH_ENV differ. See BENCHMARK.md.
#
# Input is cumulative, as the demo's apps emit it. The Datadog exporter converts
# cumulative sums itself, so no cumulativetodelta here.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource/bench:
    attributes:
      - key: deployment.environment.name
        value: ${env:BENCH_ENV}
        action: upsert
  # Run 2 on: large batches on every arm, so batching is equal and the
  # comparison isolates format and compression. Run 1 (tag run1-docs-defaults)
  # used the docs' Datadog Exporter values: 10 to 100 items.
  batch:
    send_batch_size: 8192
    send_batch_max_size: 8192
    timeout: 10s
  # A fixed-length suffix per arm (-b1 to -b6) on host.name, copied to
  # datadog.host.name, which outranks k8s.node.name in Datadog's host mapping.
  # All arms see the same GKE nodes, so without it each node collects every arm's
  # env as a host tag and Datadog mixes the envs.
  transform/bench_host:
    error_mode: ignore
    trace_statements: &bench_host
      - context: resource
        statements:
          - set(resource.attributes["host.name"], Concat([resource.attributes["host.name"], "${env:BENCH_HOST_SUFFIX}"], "")) where resource.attributes["host.name"] != nil
          - set(resource.attributes["datadog.host.name"], resource.attributes["host.name"]) where resource.attributes["host.name"] != nil
    metric_statements: *bench_host
    log_statements: *bench_host

exporters:
  datadog/exporter:
    api:
      site: ${env:DD_SITE}
      key: ${env:DD_API_KEY}

service:
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/bench, transform/bench_host, batch]
      exporters: [datadog/exporter]
