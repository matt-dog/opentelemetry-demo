# Benchmark collector, traces, OTLP path (ddototlp arm). See BENCHMARK.md.
# Same receiver, processors and batching as traces.yaml; the exporter is otlp_http
# to Datadog's OTLP intake, zstd level 3, and span_metrics stands in for the
# datadog connector.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource/bench:
    attributes:
    - key: deployment.environment.name
      value: ${env:BENCH_ENV}
      action: upsert
  transform/bench_host:
    error_mode: ignore
    trace_statements: &id001
    - context: resource
      statements:
      - set(resource.attributes["host.name"], Concat([resource.attributes["host.name"], "${env:BENCH_HOST_SUFFIX}"], "")) where resource.attributes["host.name"] != nil
      - set(resource.attributes["datadog.host.name"], resource.attributes["host.name"]) where resource.attributes["host.name"] != nil
    metric_statements: *id001
    log_statements: *id001
  batch:
    send_batch_size: 8192
    send_batch_max_size: 8192
    timeout: 10s
exporters:
  otlp_http/datadog:
    endpoint: https://otlp.${env:DD_SITE}
    headers:
      dd-api-key: ${env:DD_API_KEY}
      dd-otel-metric-config: '{ "resource_attributes_as_tags": true, "instrumentation_scope_metadata_as_tags": true }'
    compression: zstd
    compression_params:
      level: 3
service:
  telemetry:
    metrics:
      level: normal
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/bench
      - transform/bench_host
      - batch
      exporters:
      - span_metrics/datadog
      - otlp_http/datadog
    metrics/span_metrics:
      receivers:
      - span_metrics/datadog
      exporters:
      - otlp_http/datadog
      processors:
      - batch
connectors:
  span_metrics/datadog:
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    add_resource_attributes: true
    histogram:
      exponential: {}
      unit: s
    dimensions:
    - name: deployment.environment.name
    - name: service.version
    - name: http.response.status_code
    - name: container.id
    - name: aws.ecs.launchtype
    - name: aws.ecs.task.arn
    - name: cloud.provider
    - name: cloud.account.id
    - name: host.id
    - name: host.name
    - name: k8s.node.name
    - name: k8s.cluster.name
    - name: azure.resourcegroup.name
    - name: aws.s3.bucket
    - name: db.namespace
    - name: messaging.destination.name
    - name: messaging.system
    - name: server.address
    - name: operation.name
    - name: http.request.method
    - name: http.method
    - name: db.system
    - name: messaging.operation
    - name: rpc.system
    - name: rpc.service
    - name: faas.invoked_provider
    - name: faas.invoked_name
    - name: faas.trigger
    - name: graphql.operation.type
    - name: network.protocol.name
    - name: resource.name
    - name: http.route
    - name: messaging.destination
    - name: rpc.method
    - name: graphql.operation.name
    - name: db.statement
    - name: db.query.text
