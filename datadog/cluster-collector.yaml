# Cluster collector (single replica): Kubernetes Explorer, Kubernetes dashboards,
# and Kafka metrics.
#
# Sources:
#   https://docs.datadoghq.com/opentelemetry/integrations/kubernetes_metrics/
#     (cluster-collector.yaml from DataDog/opentelemetry-examples, with the
#     datadog/exporter replaced by otlp_http as that guide instructs)
#   https://docs.datadoghq.com/containers/monitoring/kubernetes_explorer/?tab=opentelemetrycollector
#   https://docs.datadoghq.com/opentelemetry/integrations/kafka_metrics/
#     ("Use the Kafka metrics receiver in a Collector running in deployment mode
#     with a single replica")
#
# Changes from the reference:
#   - resource detection is k8s_api only, and the cluster name is set explicitly.
#     The reference's gcp detector would report the GKE name (otel-demo), which
#     collides with another cluster already in Datadog staging.
#   - the clusterMetrics preset (k8s_cluster receiver) stays off. The demo's
#     DaemonSet already runs k8s_cluster behind a leader elector; running it here
#     too would double every k8s_cluster metric.
#   - kube-state-metrics target is in the otel-demo namespace.
#   - kafkametrics added in its own pipeline.
#
# Cluster name and env must match my-values-file.yml.
# Reads the datadog-secret Secret (api-key, dd-site) that up.sh creates.
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.160.0
  pullPolicy: IfNotPresent

presets:
  kubernetesObjects:
    enabled: true
    watch: true

# k8s_attributes needs to read pods and replicasets.
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces", "nodes"]
      verbs: ["get", "watch", "list"]
    - apiGroups: ["apps"]
      resources: ["replicasets"]
      verbs: ["get", "list", "watch"]

extraEnvs:
  - name: DD_API_KEY
    valueFrom:
      secretKeyRef:
        name: datadog-secret
        key: api-key
  - name: DD_SITE
    valueFrom:
      secretKeyRef:
        name: datadog-secret
        key: dd-site
  - name: K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName

config:
  receivers:
    k8sobjects:
      interval: 3m
    prometheus:
      config:
        scrape_configs:
          - job_name: "kube-state-metrics"
            metrics_path: /metrics
            scheme: http
            static_configs:
              - targets:
                  - kube-state-metrics.otel-demo.svc:8080
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: "kube_cronjob_.*|kube_daemonset_.*|kube_deployment_.*|kube_job_.*|kube_namespace_created|kube_node_.*|kube_pod_.*|kube_replicaset_.*|kube_statefulset_.*|kube_service_spec_type"
                action: keep
    kafkametrics:
      brokers: ["kafka:9092"]
      protocol_version: 2.0.0
      collection_interval: 10s
      scrapers:
        - brokers
        - topics
        - consumers

  processors:
    resource_detection:
      detectors: [k8s_api]
      override: false
    resource/add-cluster-name:
      attributes:
        - key: k8s.cluster.name
          value: "otel-demo-gke"
          action: upsert
        - key: deployment.environment.name
          value: "otel-demo-gke"
          action: upsert
    cumulativetodelta: {}
    transform/rename_uid:
      metric_statements:
        - context: datapoint
          statements:
            - set(attributes["k8s.pod.uid"], attributes["uid"])
            - delete_key(attributes, "uid")
        - context: resource
          statements:
            - delete_key(attributes, "service.name")
            - delete_key(attributes, "service.instance.id")
    groupbyattrs:
      keys:
        - k8s.pod.uid
    transform/ksm_to_dd:
      metric_statements:
        - context: datapoint
          statements:
            - set(attributes["kube_namespace"], attributes["namespace"])
            - delete_key(attributes, "namespace")
            - set(attributes["kube_deployment"], attributes["deployment"])
            - delete_key(attributes, "deployment")
            - set(attributes["pod_phase"], attributes["phase"])
            - delete_key(attributes, "phase")
            - set(attributes["kube_stateful_set"], attributes["statefulset"])
            - delete_key(attributes, "statefulset")
            - set(attributes["kube_daemon_set"], attributes["daemonset"])
            - delete_key(attributes, "daemonset")
            - set(attributes["kube_replica_set"], attributes["replicaset"])
            - delete_key(attributes, "replicaset")
            - set(attributes["kube_job"], attributes["job_name"])
            - delete_key(attributes, "job_name")
            - set(attributes["kube_service"], attributes["service"])
            - delete_key(attributes, "service")
            - set(attributes["kube_cronjob"], attributes["cronjob"])
            - delete_key(attributes, "cronjob")
    k8s_attributes:
      auth_type: "serviceAccount"
      extract:
        otel_annotations: true
        metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.deployment.name
          - k8s.namespace.name
          - k8s.node.name
          - k8s.replicaset.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.container.name
          - service.namespace
          - service.name
          - service.version
          - service.instance.id
          - container.id
          - container.image.name
          - container.image.tag
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
    transform/sum_to_gauge:
      metric_statements:
        - convert_sum_to_gauge() where metric.name == "k8s.service.count"
        - convert_sum_to_gauge() where metric.name == "k8s.node.count"
        - convert_sum_to_gauge() where metric.name == "k8s.job.count"
        - convert_sum_to_gauge() where metric.name == "k8s.deployment.count"
        - convert_sum_to_gauge() where metric.name == "k8s.pod.count"
        - convert_sum_to_gauge() where metric.name == "k8s.namespace.count"
        - convert_sum_to_gauge() where metric.name == "k8s.statefulset.count"
        - convert_sum_to_gauge() where metric.name == "k8s.daemonset.count"
        - convert_sum_to_gauge() where metric.name == "k8s.cronjob.count"

  connectors:
    count:
      datapoints:
        k8s.service.count:
          attributes:
            - key: namespace
              default_value: unspecified_namespace
            - key: type
              default_value: unspecified_service_type
          conditions:
            - metric.name == "kube_service_spec_type"
        k8s.node.count:
          conditions:
            - metric.name == "kube_node_info"
        k8s.job.count:
          attributes:
            - key: namespace
              default_value: unspecified_namespace
          conditions:
            - metric.name == "kube_job_owner"
        k8s.deployment.count:
          attributes:
            - key: namespace
              default_value: unspecified_namespace
          conditions:
            - metric.name == "kube_deployment_created"
        k8s.pod.count:
          attributes:
            - key: namespace
              default_value: unspecified_namespace
          conditions:
            - metric.name == "kube_pod_info"
        k8s.namespace.count:
          conditions:
            - metric.name == "kube_namespace_created"
        k8s.statefulset.count:
          attributes:
            - key: namespace
              default_value: unspecified_namespace
          conditions:
            - metric.name == "kube_statefulset_created"
        k8s.daemonset.count:
          attributes:
            - key: namespace
              default_value: unspecified_namespace
          conditions:
            - metric.name == "kube_daemonset_created"
        k8s.cronjob.count:
          attributes:
            - key: namespace
              default_value: unspecified_namespace
          conditions:
            - metric.name == "kube_cronjob_info"

  exporters:
    otlp_http:
      endpoint: https://otlp.${env:DD_SITE}
      logs_endpoint: https://otlp.${env:DD_SITE}/v1/logs
      headers:
        dd-api-key: ${env:DD_API_KEY}
        dd-otel-metric-config: >-
          {
          "resource_attributes_as_tags": true,
          "instrumentation_scope_metadata_as_tags": true
          }
      compression: zstd
      compression_params:
        level: 3
      sending_queue:
        batch:
          sizer: bytes
          min_size: 2097152
          max_size: 4194304

  service:
    pipelines:
      logs:
        receivers: [k8sobjects]
        processors: [resource_detection, resource/add-cluster-name]
        exporters: [otlp_http]
      metrics/count:
        receivers: [prometheus]
        exporters: [count]
      metrics:
        receivers: [prometheus, count]
        processors:
          [
            resource_detection,
            resource/add-cluster-name,
            transform/ksm_to_dd,
            transform/rename_uid,
            groupbyattrs,
            k8s_attributes,
            cumulativetodelta,
            transform/sum_to_gauge,
          ]
        exporters: [otlp_http]
      metrics/kafka:
        receivers: [kafkametrics]
        processors: [resource_detection, resource/add-cluster-name, cumulativetodelta]
        exporters: [otlp_http]
